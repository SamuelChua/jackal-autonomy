# Runtime override for the robot's ZED2i camera.
---
/**:
    ros__parameters:
        general:
            camera_model: 'zed2i'
            camera_name: 'zed2i'
            grab_resolution: 'HD2K'
            grab_frame_rate: 15

        video:
            brightness: 4
            contrast: 4
            hue: 0

        depth:
            min_depth: 0.3
            max_depth: 15.0
